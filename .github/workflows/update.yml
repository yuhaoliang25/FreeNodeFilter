name: Update free nodes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Discover public sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover
      - name: Fetch public sources
        run: npm run fetch
      - name: Build candidate subscription
        run: npm run build
      - name: Analyze source similarity
        run: npm run source-graph
      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9][^-]*\\.gz$")) | .browser_download_url' | head -1)
          test -n "$asset"
          mkdir -p mihomo
          curl -fsSL --retry 3 "$asset" -o mihomo/mihomo.gz
          gunzip -f mihomo/mihomo.gz
          chmod +x mihomo/mihomo
      - name: Generate Mihomo config
        run: |
          node - <<'NODE'
          const fs=require('fs'),yaml=require('js-yaml');
          const d=yaml.load(fs.readFileSync('subscriptions/all.yaml','utf8'));
          const p=d.proxies||[];
          const cfg=yaml.load(fs.readFileSync('mihomo/config-template.yaml','utf8'));
          cfg.proxies=p;
          cfg['proxy-groups'][0].proxies=p.map(x=>x.name);
          fs.mkdirSync('mihomo',{recursive:true});
          fs.writeFileSync('mihomo/config.yaml',yaml.dump(cfg,{lineWidth:-1,noRefs:true}));
          console.log('nodes:',p.length);
          NODE
      - name: Validate Mihomo config
        run: |
          set -euo pipefail
          if ! mihomo/mihomo -t -d mihomo -f mihomo/config.yaml > mihomo/config-test.log 2>&1; then
            cat mihomo/config-test.log
            exit 1
          fi
      - name: Start Mihomo
        run: |
          set -euo pipefail
          mihomo/mihomo -d mihomo -f mihomo/config.yaml > mihomo/mihomo.log 2>&1 &
          pid=$!
          echo "$pid" > mihomo/mihomo.pid

          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Mihomo exited during startup (attempt $i). Log:"
              cat mihomo/mihomo.log || true
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:9090/version > mihomo/version.json 2>/dev/null; then
              echo "Mihomo API is ready:"
              cat mihomo/version.json
              exit 0
            fi
            sleep 1
          done

          echo "Mihomo process is alive but API did not become ready. Log:"
          cat mihomo/mihomo.log || true
          exit 1
      - name: Multi-round Google health check
        env:
          TEST_ROUNDS: '3'
          TEST_TIMEOUT: '8000'
          FAST_TIMEOUT: '5000'
          STAGE2_LIMIT: '300'
          STAGE3_LIMIT: '100'
          TEST_BATCH_SIZE: '250'
          TEST_BATCH_PAUSE_MS: '500'
          TEST_CONCURRENCY: '24'
          TEST_EXPECTED: '204'
          GOOGLE_TEST_URL: https://www.google.com/generate_204
        run: node scripts/test-google.js
      - name: Diagnose failed nodes
        env:
          DIAG_LIMIT: '100'
          DIAG_TIMEOUT: '8000'
          GOOGLE_TEST_URL: https://www.google.com/generate_204
        run: node scripts/diagnose-failures.js
      - name: Rebuild filtered subscriptions
        run: node scripts/build-subscriptions.js
      - name: Convert final subscriptions to importable Mihomo configs
        run: node scripts/convert-subscriptions.js
      - name: Commit generated subscriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptions mihomo/*.yaml data/candidates.json data/health.json data/history.json data/reputation.json data/diagnostics.json data/scores.json data/source-history.json data/source-reputation.json data/source-similarity.json data/sources.json data/raw-sources.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh node candidates"
          git push
